<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><meta name="seo_hidden" content="true"><title>Workbench intro · AK customiser | Atelier Vincent De Nil</title><link rel="icon" href="/favicon.ico"><link rel="canonical" href="https://vincentdenil.com/3d/partisan-project/ak15-workbench-intro/">
<style>html,body{height:100%;margin:0;background:#07090a;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head><body>
<!-- Shell: holds the Partisan sound layer (../sound-layer.js) so the music plays on while the
     frame moves from the bench (bench.html) to the customiser and back. See README.md. -->
<iframe id="view" title="Partisan workbench" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
<script type="module">
import {soundLayer} from '../sound-layer.js';
const sound=soundLayer();sound.shared=true;// created here, before the frame's pages ask for it
const view=document.querySelector('#view');
const BENCH=new URL('./bench.html',location.href),CUSTOMISER=new URL('./ak15-weapon-customiser/',location.href);
// The address bar follows the frame: ?view=customiser plus the customiser's loadout hash, so a
// reload (or a copied link) comes back to the same screen and build.
const params=new URLSearchParams(location.search);
// ?sfx=placeholder switches the frame's pages to the placeholder recordings (see mech.js).
if(params.get('sfx')==='placeholder')try{sessionStorage.setItem('ak-sfx','placeholder');}catch{}
view.src=params.get('view')==='customiser'?CUSTOMISER.href+location.hash:BENCH.href+location.hash;
function sync(){
 let inner;try{inner=view.contentWindow.location;}catch{return;}
 if(!inner.href||inner.href==='about:blank')return;
 const customiser=inner.pathname===CUSTOMISER.pathname;
 const want=location.pathname+(customiser?'?view=customiser'+inner.hash:inner.hash);
 if(location.pathname+location.search+location.hash!==want)history.replaceState(null,'',want);
 const title=view.contentDocument?.title;if(title&&document.title!==title)document.title=title;
}
view.addEventListener('load',()=>{sync();view.focus();});
setInterval(sync,1000);// the customiser rewrites its hash as the build changes
</script>
</body></html>
