<!doctype html>
<!-- =====================================================================

     To activate later:
       1. Change the homepage button href from the mailto to /contact.
       2. Get a free key at web3forms.com (send to info@vincentdenil.com)
          and paste it over REPLACE_WITH_ACCESS_KEY below.
     Until both are done, leave this file in the repo, unlinked.
     ===================================================================== -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact | Atelier Vincent De Nil</title>
<meta name="description" content="Get in touch with Atelier Vincent De Nil for project inquiries, collaborations, and press.">
<link rel="canonical" href="https://vincentdenil.com/contact">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon_32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicons/favicon_16x16.png">
<link rel="apple-touch-icon" sizes="256x256" href="/assets/favicons/favicon_256x256.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<!-- Contact schema: adds email + phone numbers to the same #atelier entity used site-wide -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ContactPage",
  "url": "https://vincentdenil.com/contact",
  "name": "Contact, Atelier Vincent De Nil",
  "mainEntity": {
    "@type": "Organization",
    "@id": "https://vincentdenil.com/#atelier",
    "name": "Atelier Vincent De Nil BV",
    "url": "https://vincentdenil.com/",
    "email": "info@vincentdenil.com",
    "contactPoint": [
      {
        "@type": "ContactPoint",
        "contactType": "sales",
        "telephone": "+32493504590",
        "email": "info@vincentdenil.com",
        "areaServed": "EU"
      },
      {
        "@type": "ContactPoint",
        "contactType": "sales",
        "telephone": "+13052005907",
        "email": "info@vincentdenil.com",
        "areaServed": "US"
      }
    ]
  }
}
</script>

<style>
  :root{
    --prussian:#06182A;
    --flat:#002b44;
    --panel:#0b304b;
    --field:#08263b;
    --line:rgba(255,255,255,.16);
    --panel-line:rgba(255,255,255,.12);
    --btn:#0b304b;
    --btn-hover:#14456a;
    --text:#EAF2F8;
    --text-soft:#9EBAD0;
    --col:720px;
    --bg:url('/assets/background.jpg');
  }
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0; min-height:100vh; position:relative;
    color:var(--text); background-color:var(--flat);
    font-family:"Figtree", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    line-height:1.6; -webkit-font-smoothing:antialiased;
    display:flex; justify-content:center;
  }
  body::before{
    content:""; position:absolute; top:0; left:0; right:0; height:100vh; z-index:-2;
    background-color:var(--flat);
    background-image:
      linear-gradient(to bottom, rgba(0,43,68,0) 60%, var(--flat) 100%),
      var(--bg);
    background-size:cover; background-position:center; background-repeat:no-repeat;
  }
  .wrap{ width:100%; max-width:var(--col); padding:clamp(2rem,6vh,4rem) clamp(1.1rem,4vw,1.5rem) 2.5rem; text-align:center; }

  .brand{ display:inline-flex; align-items:center; gap:20px; margin:0 auto 2.4rem; text-decoration:none; color:var(--text); }
  .brand img{ height:64px; width:auto; display:block; }
  .wordmark{ text-align:left; line-height:1; }
  .wordmark .a{ display:block; font-size:.78rem; font-weight:500; letter-spacing:.44em; color:var(--text); margin-bottom:.5em; }
  .wordmark .n{ display:block; font-size:1.6rem; font-weight:600; letter-spacing:.24em; text-transform:uppercase; color:var(--text); }

  .card{ background:var(--panel); padding:34px; text-align:left; }
  h1{ font-size:1.6rem; font-weight:700; margin:0 0 .4rem; }
  .lede{ color:#D3E1EC; margin:0 0 1.6rem; }

  form{ display:flex; flex-direction:column; gap:14px; }
  label{ font-size:.8rem; font-weight:600; letter-spacing:.02em; color:var(--text-soft); text-transform:uppercase; margin-bottom:-6px; }
  input, textarea{
    font-family:inherit; font-size:1rem; color:var(--text);
    background:var(--field); border:1px solid var(--line); border-radius:0;
    padding:12px 14px; width:100%;
  }
  input::placeholder, textarea::placeholder{ color:rgba(158,186,208,.6); }
  input:focus, textarea:focus{ outline:2px solid #7FB2D8; outline-offset:2px; border-color:transparent; }
  textarea{ resize:vertical; min-height:140px; }
  button{
    font-family:inherit; font-size:1.05rem; font-weight:600; color:var(--text);
    background:var(--btn-hover); border:0; border-radius:0; padding:15px 22px; cursor:pointer; margin-top:6px;
  }
  button:hover, button:focus-visible{ background:#1c5583; }
  button:focus-visible{ outline:2px solid #7FB2D8; outline-offset:3px; }
  .formnote{ font-size:.85rem; min-height:1.2em; margin-top:4px; }
  .formnote.ok{ color:#9FE3B4; }
  .formnote.err{ color:#F0A9A0; }

  .direct{ margin-top:1.8rem; padding-top:1.4rem; border-top:1px solid var(--panel-line); display:flex; flex-wrap:wrap; gap:10px 28px; }
  .direct a{ color:var(--text); text-decoration:none; font-weight:500; border-bottom:1px solid var(--line); padding-bottom:1px; }
  .direct a:hover, .direct a:focus-visible{ color:#B9D4E8; }
  .direct .tag{ color:var(--text-soft); font-size:.72rem; font-weight:600; letter-spacing:.14em; text-transform:uppercase; margin-right:8px; }

  .back{ display:inline-block; margin-top:2rem; color:var(--text-soft); text-decoration:none; font-size:.9rem; }
  .back:hover{ color:var(--text); }

  footer{ margin-top:2.6rem; color:var(--text-soft); font-size:.82rem; line-height:1.8; }
  footer .mot{ font-style:italic; color:#C4D8E8; }

  @media (max-width:520px){
    .card{ padding:24px; }
    .wordmark .n{ font-size:1.3rem; letter-spacing:.18em; }
  }
</style>
</head>

<body>
  <main class="wrap">

    <a class="brand" href="/">
      <img src="/assets/logo-stag.svg" alt="" width="49" height="64">
      <span class="wordmark"><span class="a">ATELIER</span><span class="n">Vincent De Nil</span></span>
    </a>

    <section class="card">
      <h1>Contact &amp; Inquiries</h1>
      <p class="lede">Project inquiries, collaborations, and press. I read every message.</p>

      <!-- =====================================================================
           FORM DELIVERY: this posts to Web3Forms, a free static-site form
           handler that emails submissions to you. To activate it:
             1. Go to web3forms.com, enter info@vincentdenil.com, get an access key.
             2. Paste the key below, replacing REPLACE_WITH_ACCESS_KEY.
           Until then the form will not deliver. Nothing else needs changing.
           ===================================================================== -->
      <form id="contactForm" action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="REPLACE_WITH_ACCESS_KEY">
        <input type="hidden" name="subject" value="New inquiry from vincentdenil.com">
        <input type="hidden" name="from_name" value="vincentdenil.com contact form">
        <input type="checkbox" name="botcheck" tabindex="-1" autocomplete="off" style="display:none">

        <label for="name">Name</label>
        <input id="name" type="text" name="name" required placeholder="Your name">

        <label for="email">Email</label>
        <input id="email" type="email" name="email" required placeholder="you@example.com">

        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="What can I help with?"></textarea>

        <button type="submit">Send message</button>
        <p class="formnote" id="formNote" role="status" aria-live="polite"></p>
      </form>

      <div class="direct">
        <span><span class="tag">EU</span><a href="tel:+32493504590">+32 493 50 45 90</a></span>
        <span><span class="tag">US</span><a href="tel:+13052005907">+1 305 200 5907</a></span>
        <span><span class="tag">Email</span><a href="mailto:info@vincentdenil.com">info@vincentdenil.com</a></span>
      </div>
    </section>

    <a class="back" href="/">Back to home</a>

    <footer>
      All rights reserved, Atelier Vincent De Nil BV, Belgium.<br>
      <span class="mot">Luctor et Emergo</span>
    </footer>

  </main>

  <script>
    (function(){
      var form = document.getElementById('contactForm');
      var note = document.getElementById('formNote');
      if(!form) return;
      form.addEventListener('submit', function(e){
        e.preventDefault();
        note.className = 'formnote';
        note.textContent = 'Sending...';
        var data = new FormData(form);
        fetch(form.action, { method:'POST', body:data, headers:{ 'Accept':'application/json' } })
          .then(function(r){ return r.json(); })
          .then(function(json){
            if(json.success){
              note.className = 'formnote ok';
              note.textContent = 'Thanks, your message is on its way.';
              form.reset();
            } else {
              note.className = 'formnote err';
              note.textContent = json.message || 'Something went wrong. Please email info@vincentdenil.com directly.';
            }
          })
          .catch(function(){
            note.className = 'formnote err';
            note.textContent = 'Could not send. Please email info@vincentdenil.com directly.';
          });
      });
    })();
  </script>
</body>
</html>
