<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>550 File unavailable | Atelier Vincent De Nil</title>
<meta name="robots" content="noindex">

<link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="16x16 32x32 48x48 64x64 128x128">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicons/favicon_32x32.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ftp.css">
</head>

<body>
  <main class="wrap">

    <a class="brand" href="/">🦌 AVDN - EXPERIMENTS AND PROJECTS</a>

    <section class="term">
      <div class="term-body">
        <p class="line dim">&gt; RETR <span id="fname">file</span></p>
        <p class="line">550 File unavailable &mdash; this is just a placeholder.</p>
        <p class="line dim">Nothing uploaded to this slot yet. Check back later.</p>
      </div>
    </section>

    <a class="back" href="#" id="backLink">..</a>

    <footer>
      All rights reserved, Atelier Vincent De Nil BV, Belgium.<br>
      <span class="mot">Luctor et Emergo</span>
    </footer>

  </main>

  <script>
    (function(){
      var params = new URLSearchParams(window.location.search);
      var name = params.get('name');
      var fEl = document.getElementById('fname');
      if(name && fEl) fEl.textContent = name;

      var back = document.getElementById('backLink');
      var ref = document.referrer;
      if(back){
        if(ref && ref.indexOf(window.location.origin) === 0){
          back.href = ref;
        } else {
          back.href = '/projects/';
        }
      }
    })();
  </script>
</body>
</html>
