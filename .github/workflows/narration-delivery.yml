name: Narration repository delivery
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/narration/requests.json'
      - 'tools/narration/retention.json'
permissions:
  contents: write
concurrency:
  group: narration-repository-delivery
  cancel-in-progress: false
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependencies
        if: github.event_name != 'schedule'
        run: |
          python -m pip install edge-tts==7.3.1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Test delivery and cleanup rules
        run: python3 -m unittest discover -s tools/narration -p test_delivery.py -v
      - name: Validate and render requests or clean up expired delivery
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            python tools/narration/deliver.py --cleanup-only
          else
            python tools/narration/deliver.py
          fi
      - name: Commit delivery to the synced repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- outbound/audio
          git diff --cached --quiet && exit 0
          git diff --cached --name-only | python -c 'import sys; paths=sys.stdin.read().splitlines(); assert all(p.startswith("outbound/audio/") and (p.endswith(".mp3") or p.endswith(".json")) for p in paths)'
          git commit -m "Deliver verified narration and apply audio retention policy"
          git fetch origin main
          # Fail on concurrent edits to scripts, requests or policies rather than publishing stale audio.
          git diff --exit-code HEAD origin/main -- docs tools/narration
          git rebase origin/main
          git push origin HEAD:main
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$(git rev-parse HEAD)"
