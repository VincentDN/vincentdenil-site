name: Deliver Founder Curriculum Part Four audio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/founder-part-four-audio.yml'
permissions:
  contents: read
concurrency:
  group: founder-part-four-audio
  cancel-in-progress: false
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Microsoft TTS client and audio tools
        run: |
          python -m pip install edge-tts==7.3.1
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Render and validate narration
        run: python tools/narration/render_founder_part_four.py
      - name: Upload verified narration
        uses: actions/upload-artifact@v4
        with:
          name: founder-curriculum-part-four-alistair
          path: |
            outbound/audio/founder-curriculum/*.mp3
            outbound/audio/founder-curriculum/*.validation.json
          if-no-files-found: error
          retention-days: 7
